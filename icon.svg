<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <defs>
        <!-- Pozadie: Moderný VS Code tmavý prechod -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e1e3f"/>
            <stop offset="100%" stop-color="#090912"/>
        </linearGradient>

        <!-- Kovový prechod pre robota -->
        <linearGradient id="metalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7a8bb0"/>
            <stop offset="100%" stop-color="#3c4866"/>
        </linearGradient>

        <!-- Žiarivá zelená pre "úspešný test" kvapalinu -->
        <linearGradient id="liquidColor" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00ffcc"/>
            <stop offset="100%" stop-color="#00b377"/>
        </linearGradient>

        <!-- Zlatá pre AI hviezdu -->
        <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffe259"/>
            <stop offset="100%" stop-color="#ffa751"/>
        </linearGradient>

        <!-- Svetelný filter pre oči a anténu (Glow) -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- 1. Tmavé zaoblené pozadie -->
    <rect width="256" height="256" rx="56" fill="url(#bgGradient)"/>

    <!-- 2. ROBOT (Vľavo - bez krku) -->
    <!-- Hlava -->
    <rect x="36" y="96" width="84" height="84" rx="20" fill="url(#metalGlow)" stroke="#92a4c9" stroke-width="4"/>
    
    <!-- Anténa -->
    <line x1="78" y1="96" x2="78" y2="50" stroke="#92a4c9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="78" cy="44" r="12" fill="#00f2fe" filter="url(#neonGlow)"/>
    
    <!-- Oči (Žiarivé modré) -->
    <circle cx="58" cy="130" r="9" fill="#00f2fe" filter="url(#neonGlow)"/>
    <circle cx="98" cy="130" r="9" fill="#00f2fe" filter="url(#neonGlow)"/>
    
    <!-- Ústa -->
    <rect x="66" y="156" width="24" height="6" rx="3" fill="#181a26"/>

    <!-- 3. SKÚMAVKA (Vpravo - Kreslená PRED rukou, aby ju ruka mohla objať) -->
    <!-- Zadná sklenená stena -->
    <path d="M 172 60 v 110 a 20 20 0 0 0 40 0 v -110 Z" fill="#ffffff" opacity="0.05"/>
    
    <!-- Testovacia kvapalina -->
    <path d="M 175 120 v 50 a 17 17 0 0 0 34 0 v -50 Z" fill="url(#liquidColor)"/>
    <ellipse cx="192" cy="120" rx="17" ry="5" fill="#00ffcc" opacity="0.8"/>
    
    <!-- Bublinky v kvapaline -->
    <circle cx="184" cy="155" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="200" cy="140" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="188" cy="130" r="2.5" fill="#ffffff" opacity="0.7"/>

    <!-- Predná stena skúmavky (Odlesk skla) -->
    <path d="M 172 60 v 110 a 20 20 0 0 0 40 0 v -110 Z" fill="none" stroke="#a0b9d9" stroke-width="6" opacity="0.7"/>
    <path d="M 178 70 v 80" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Hrdlo skúmavky -->
    <rect x="166" y="52" width="52" height="10" rx="4" fill="#a0b9d9"/>

    <!-- 4. ROBOTICKÁ RUKA (Ide z robota a objíma skúmavku spredu) -->
    <!-- Rameno (Vychádza z boku robota) -->
    <path d="M 118 140 L 140 150 L 158 140" fill="none" stroke="url(#metalGlow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Kĺb zápästia -->
    <circle cx="158" cy="140" r="7" fill="#92a4c9"/>
    
    <!-- Klepeto (Otvorené doprava, drží prednú časť skúmavky) -->
    <path d="M 195 125 C 175 120, 158 125, 158 140 C 158 155, 175 160, 195 155" fill="none" stroke="#92a4c9" stroke-width="8" stroke-linecap="round"/>

    <!-- 5. AI HVIEZDA (Vpravo hore) -->
    <path d="M 210 18 Q 210 44 184 44 Q 210 44 210 70 Q 210 44 236 44 Q 210 44 210 18 Z" fill="url(#goldStar)" filter="url(#neonGlow)"/>
    <circle cx="230" cy="22" r="3" fill="#ffe259" filter="url(#neonGlow)"/>
</svg>