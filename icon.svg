<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <defs>
        <!-- DITEC Brand Gradient -->
        <linearGradient id="ditecBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#009A8F"/> <!-- Vibrant Teal -->
            <stop offset="100%" stop-color="#004D48"/> <!-- Deep Teal -->
        </linearGradient>

        <!-- Kovový gradient pre robota -->
        <linearGradient id="robotBody" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f0fdfa"/>
            <stop offset="100%" stop-color="#ccfbf1"/>
        </linearGradient>

        <!-- Glow filter pre oči -->
        <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- 1. Pozadie (DITEC Corporate Design) -->
    <rect width="256" height="256" rx="56" fill="url(#ditecBg)"/>

    <!-- 2. VEĽKÁ INTELIGENTNÁ BANKA (Posunutá doprava) -->
    <g transform="translate(145, 115)">
        
        <!-- TEKUTINA (Vykreslená ako PRVÁ, aby bola vnútri čiar) -->
        <!-- Presne vypočítaný vnútorný priestor banky -->
        <path d="M -66 35 Q 5 48 76 35 L 81 55 A 12 12 0 0 1 68 73 H -58 A 12 12 0 0 1 -71 55 Z" 
              fill="#61C2B9" opacity="0.8"/>

        <!-- HLAVNÁ SILUETA BANKY (Biela čiara) -->
        <path d="M -20 -90 L -80 60 A 20 20 0 0 0 -65 85 H 75 A 20 20 0 0 0 90 60 L 20 -90 Z" 
              fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
        
        <!-- Hrdlo banky -->
        <line x1="-32" y1="-90" x2="32" y2="-90" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
        
        <!-- Bublinky a detaily -->
        <circle cx="20" cy="55" r="4" fill="#FFFFFF" opacity="0.6"/>
        <path d="M 45 -40 L 65 15" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.2"/>
    </g>

    <!-- 3. ROBUSTNÁ HLAVA ROBOTA (Integrovaná vľavo dole) -->
    <g transform="translate(30, 140)">
        <!-- Telo hlavy -->
        <rect x="0" y="0" width="105" height="85" rx="18" fill="url(#robotBody)" stroke="#004D48" stroke-width="3"/>
        
        <!-- Digitálny priezor -->
        <rect x="12" y="15" width="81" height="35" rx="8" fill="#002b28"/>
        
        <!-- Svietiace oči (AI senzory) -->
        <circle cx="35" cy="32" r="10" fill="#009A8F" filter="url(#neonGlow)"/>
        <circle cx="70" cy="32" r="10" fill="#009A8F" filter="url(#neonGlow)"/>
        
        <!-- Anténa -->
        <path d="M 30 0 V -30" stroke="#f0fdfa" stroke-width="10" stroke-linecap="round"/>
        <circle cx="30" cy="-35" r="12" fill="#00ffcc" filter="url(#neonGlow)"/>
        
        <!-- Indikátor úst -->
        <rect x="38" y="62" width="30" height="4" rx="2" fill="#004D48" opacity="0.2"/>
    </g>

    <!-- 4. SPOJOVACÍ PRVOK (Prepojenie systémov) -->
    <rect x="130" y="182" width="15" height="8" fill="#FFFFFF" opacity="0.4" rx="2"/>
</svg>