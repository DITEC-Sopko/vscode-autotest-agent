<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- BANKA (Plná veľkosť, ale s výrezom pre robota vľavo dole) -->
    <!-- Horný okraj a hrdlo -->
    <path d="M9 2h6" />
    <path d="M10 2v5" />
    <path d="M14 2v5l5 11a2 2 0 0 1-2 2h-8" /> <!-- Pravá strana a spodok po robota -->
    <path d="M14 7L11 14" opacity="0.3" stroke-dasharray="2 2" /> <!-- Vnútorná línia krku -->

    <!-- ROBOT (Dole vľavo, jednoznačne viditeľný) -->
    <!-- Hlava robota s anténkou -->
    <rect x="2" y="14" width="8" height="6" rx="1.5" /> 
    
    <!-- Anténka -->
    <path d="M4 14v-2" />
    <circle cx="4" cy="11" r="0.6" fill="currentColor" stroke="none" />
    
    <!-- Oči robota (Svietiace body) -->
    <circle cx="4.5" cy="17" r="0.7" fill="currentColor" stroke="none" />
    <circle cx="7.5" cy="17" r="0.7" fill="currentColor" stroke="none" />
    
    <!-- Spojnica (akoby ruka alebo kábel k banke) -->
    <path d="M10 17h2" opacity="0.5" />
    
    <!-- Tekutina na dne (pre lepšiu vizuálnu váhu) -->
    <path d="M11 20h6" opacity="0.4" />
</svg>